name: Flutter CI (analyze & test)

on:
  push:
    branches: [ "feature/assist-provider-mobility" ]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
      - run: flutter --version
      - run: flutter pub get
      - name: Static analysis (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: |
          if [ -d test ] && ls test/*_test.dart >/dev/null 2>&1; then
            flutter test
          else
            echo "No Dart tests found — skipping"
          fi
