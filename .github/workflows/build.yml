name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches: [main, "fix/assist-catalogue-null-vendor", "feature/assist-multiservice"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
      - name: Write key.properties
        run: echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release App Bundle
        run: flutter build appbundle --release
      - name: Publish signed APK as a Release (one-tap phone install)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: assist-fix-${{ github.run_number }}
          name: Assist catalogue fix (build ${{ github.run_number }})
          body: |
            Signed release build with the Assist canonical-catalogue fix
            (vendor-less services now parse and display).

            Install this APK over your current app - it is signed with the
            same release key, so there is no need to uninstall and your login
            is kept. After installing, open Assist: Browse Categories,
            Trending This Week and Popular Services will now list services.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
