name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches: [main, "feature/customer-unified"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve built commit SHA
        id: meta
        # The actual commit checked out — used so the release tag points to
        # exactly what was built, not the repo's default branch.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
      - name: Write key.properties
        run: echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      - name: Install dependencies
        run: flutter pub get
      - name: Run Shared Rides Dart tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release App Bundle
        run: flutter build appbundle --release
      - name: Show signing fingerprint of the AAB
        run: keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "SHA1|SHA256|Owner" | tee -a $GITHUB_STEP_SUMMARY
      - name: Publish signed APK as a Release (one-tap phone install)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: customer-unified-${{ github.run_number }}
          name: Customer UNIFIED - Taxi + Parcel + Shared Rides + Assist (build ${{ github.run_number }})
          # Point the tag at the exact commit that was built (see Resolve step),
          # instead of letting the action default to the repo's default branch.
          target_commitish: ${{ steps.meta.outputs.sha }}
          body: |
            Unified Tendo Customer app: Taxi, Parcel, Shared Rides (Private/Shared
            selector, fares, pooled-consent tracking) and Assist multi-service, plus
            the address-search / GPS crash fixes and null-safe googleMapApiKey.
            Install over the current app - same signing key, no uninstall, keeps login.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
