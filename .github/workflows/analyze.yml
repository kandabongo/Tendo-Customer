name: Analyze (Assist files)
on:
  push:
    branches: [ci-analyze]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      - run: flutter pub get
      - name: Analyze changed files; every finding becomes an annotation
        run: |
          flutter --version | head -1
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/requests/assist_extras.request.dart lib/models/assist_invoice.dart \
            lib/views/pages/order/widgets/assist_extras.view.dart lib/views/pages/order/orders_details.page.dart \
            lib/models/order.dart > out.txt 2>&1
          code=$?
          echo "analyze exit code: $code"
          echo "::notice title=analyze exit code::$code"
          grep -c ' error • ' out.txt | sed 's/^/errors: /'
          grep -c ' warning • ' out.txt | sed 's/^/warnings: /'
          grep -c ' info • ' out.txt | sed 's/^/infos: /'
          while IFS= read -r line; do
            case "$line" in
              *' • '*) echo "::notice title=analyze::$(echo "$line" | sed 's/^ *//' | cut -c1-400)" ;;
              *issue*|*"No issues"*) echo "::notice title=analyze summary::$line" ;;
            esac
          done < out.txt
          exit $code
